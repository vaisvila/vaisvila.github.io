# Authors
# Optional per-page author override (set `author: alexander` in a page's front matter).
# The sidebar normally uses the `author:` block in _config.yml.

alexander:
  name        : "Alexander Vaisvil"
  uri         : # TODO(Alexander): personal website URL (unverified: http://alexandervaisvil.com)
  email       : "alexander.vaisvil@water.ca.gov"
  bio         : "Alexander Vaisvil is the Lead Biometrician and Population Modeler with the California Department of Water Resources in Sacramento, California. Previously, as a Fish Biologist with the U.S. Bureau of Reclamation's Bay-Delta Area Office, he developed Chinook Salmon life-cycle models, structured decision making analyses, and R Shiny decision-support tools to evaluate flow and temperature management for Central Valley salmon. He earned his Ph.D. in Fisheries Science from Oklahoma State University in 2026, studying the population dynamics of Striped Bass in the Robert S. Kerr river-reservoir complex, and his M.S. in Fish, Wildlife, and Conservation Ecology from New Mexico State University, studying the natal origin and recruitment of Largemouth Bass in Elephant Butte Reservoir."
  avatar      : "profile.png" # TODO(Alexander): replace with a real headshot in /images/
